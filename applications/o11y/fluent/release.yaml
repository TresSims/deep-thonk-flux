---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: o11y
spec:
  interval: 10m
  chart:
    spec:
      chart: fluent-bit
      version: '0.57.7'
      sourceRef:
        kind: HelmRepository
        name: fluent-bit-helm
        namespace: o11y
      interval: 10m
  values:
    # fluent/fluent-bit helm chart — YAML-format config via extraFiles
    # Replace <VICTORIA_LOGS_HOST>, <VICTORIA_METRICS_HOST>, <CLUSTER_NAME>

    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    rbac:
      nodeAccess: true

    extraVolumes:
      - name: proc
        hostPath:
          path: /proc

    extraVolumeMounts:
      - name: proc
        mountPath: /host/proc
        readOnly: true

    # Tell Fluent Bit to load our YAML file instead of the INI config
    env:
      - name: FLB_CONFIG_FILE
        value: /fluent-bit/etc/conf/fluent-bit.yaml

    # Disable the chart's built-in INI rendering so it doesn't conflict
    config:
      service: ""
      inputs: ""
      filters: ""
      outputs: ""
      customParsers: ""

    # Supply the YAML config as an extra file mounted into the config volume
    extraFiles:
      fluent-bit.yaml: |
        service:
          daemon: false
          flush: 5
          log_level: info
          http_server: true
          http_listen: 0.0.0.0
          http_port: 2020
          health_check: true
          storage.metrics: true

        pipeline:
          inputs:
            - name: tail
              tag: kube.*
              path: /var/log/containers/*.log
              multiline.parser: docker, cri
              db: /var/log/flb_kube.db
              mem_buf_limit: 5MB
              skip_long_lines: true

            - name: systemd
              tag: host.*
              systemd_filter: _SYSTEMD_UNIT=kubelet.service
              read_from_tail: true

            - name: node_exporter_metrics
              tag: node_metrics
              path_procfs: /host/proc
              scrape_interval: 60

          filters:
            - name: kubernetes
              match: "kube.*"
              merge_log: true
              keep_log: false
              k8s-logging.parser: true
              k8s-logging.exclude: true

            - name: record_modifier
              match: "kube.*"
              records:
                - cluster <CLUSTER_NAME>

            - name: record_modifier
              match: node_metrics
              records:
                - cluster <CLUSTER_NAME>

          outputs:
            - name: http
              match: "kube.*"
              host: <VICTORIA_LOGS_HOST>
              port: 9428
              uri: /insert/jsonline?_stream_fields=kubernetes_namespace_name,kubernetes_pod_name,kubernetes_container_name,cluster&_msg_field=log&_time_field=time
              format: json_lines
              compress: gzip

            - name: http
              match: "host.*"
              host: <VICTORIA_LOGS_HOST>
              port: 9428
              uri: /insert/jsonline?_stream_fields=_SYSTEMD_UNIT,cluster&_msg_field=MESSAGE&_time_field=time
              format: json_lines
              compress: gzip

            - name: prometheus_remote_write
              match: node_metrics
              host: <VICTORIA_METRICS_HOST>
              port: 8428
              uri: /api/v1/write
              add_label:
                - cluster <CLUSTER_NAME>
                - job node-exporter
